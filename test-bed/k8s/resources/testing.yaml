---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contender
  labels:
    app: contender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contender
  template:
    metadata:
      labels:
        app: contender
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - ubuntu-cp
      containers:
        - name: contender
          image: docker.io/cbarbieru/contender:0.5.5-tps-ms
          command: ["/bin/sh", "-c"]
          args: ["sleep infinity"]
          volumeMounts:
            - name: contender-reports
              mountPath: /root/.contender/reports
            - name: contender-config
              mountPath: /script
            - name: jwt-secret
              mountPath: /data/jwtsecret
      volumes:
        - name: contender-reports
          hostPath:
            path: /tmp/sceal/contender/reports
        - name: contender-config
          hostPath:
            path: /tmp/sceal/contender
        - name: jwt-secret
          hostPath:
            path: /tmp/sceal/contender/jwtsecret

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundry-test
  labels:
    app: foundry-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foundry-test
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: foundry-test
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - ubuntu-cp
      containers:
        - name: foundry-test
          image: ghcr.io/foundry-rs/foundry:latest
          command: ["/bin/sh", "-c"]
          args: ["sleep infinity"]
          env:
            - name: RPC_URL
              value: http://op-geth:8545
            - name: ADDR
              value: 0xEbFDBdc8Dc86220aad9C581E0Bd68391bC11e170
            - name: PRIV_KEY
              value: 0x6e618720a28574533d1abe73babd6b2a87095a1361ab18572d995ba9fd1629b5
      restartPolicy: Always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmeter
  labels:
    app: jmeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jmeter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jmeter
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - ubuntu-cp
      containers:
        - name: jmeter
          image: docker.io/alpine/jmeter:5.6.3
          command: ["/bin/sh", "-c"]
          args: ["sleep infinity"]
          volumeMounts:
            # online-voting-tests.jmx (copied by setup-testing.sh) and the voter CSVs written by
            # the online-voting-be pod; both pods run on ubuntu-cp so they share this host dir.
            - name: jmeter-data
              mountPath: /test
      volumes:
        - name: jmeter-data
          hostPath:
            path: /tmp/sceal/jmeter
            type: DirectoryOrCreate
