[package]
name = "tog-enclave"
version = "0.1.0"
edition = "2024"

[features]
# Terminate TLS inside the enclave on the submit endpoint (self-signed cert; the
# client does not verify it yet → "TLS-with-stub-attestation"). Needs mbedtls +
# a C toolchain (cmake), so build it on the Linux SGX box; the dev Mac builds the
# default plaintext path. Adding the SGX quote to the cert + client verification
# turns this into real RA-TLS.
tls = ["dep:mbedtls"]

[dependencies]
tog-core = { path = "../tog-core" }
tog-proto = { path = "../tog-proto" }
# `Bytes`/`B256` types at the protocol edge; `hex` for 0x string conversion.
# Both are pure Rust and compile for the SGX target.
alloy-primitives = { version = "1.0.23", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# Optional TLS (feature `tls`). From git `main`, not crates.io: the released
# 0.12.5 uses the `doc_auto_cfg` nightly feature that recent Rust removed and
# won't compile; `main` uses `doc_cfg`. SGX is auto-detected (no `sgx` feature);
# `ssl` gives the TLS module used in transport.rs.
mbedtls = { git = "https://github.com/fortanix/rust-mbedtls", optional = true, features = ["ssl"] }

# Enclave layout consumed by `ftxsgx-elf2sgxs` (and the cargo-sgx runner).
# Tune these to your box: heap must hold the pool; `threads` caps concurrent
# connections because each SGX thread needs a preallocated TCS.
[package.metadata.fortanix-sgx]
heap-size = 2147483648   # 2 GiB  (requires SGX2 / large EPC; drop to ~64 MiB on SGX1)
stack-size = 262144      # 256 KiB per thread
threads = 16             # max concurrent enclave threads == max in-flight conns
debug = true             # set false for production (enables enclave debug)
